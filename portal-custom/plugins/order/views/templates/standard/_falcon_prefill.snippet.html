<!-- ==== Falcon of Codes prefill (BEGIN) ============================================
     Prefills subdomain + theme on the order config form from the homepage handoff,
     then auto-submits to cart when ?auto=1 (skips manual "Continue" click).

     Carrier: sessionStorage (same origin) + URL query params (?subdomain=&theme=&token=).
     Config options load via AJAX — MutationObserver + interval re-apply until filled.

     UPGRADE-SAFETY: plugin template override. Re-apply from portal-custom/ after
     Blesta/order-plugin updates (see portal-custom/NOTES.md).
     Option IDs: see falcon-provisioner/templates/blesta_packages.json
================================================================================ -->
<script type="text/javascript">
(function () {
  // package_options.id (DOM name: configoptions[<id>]). Sync with blesta_packages.json.
  var OPTS = { subdomain: 67, theme: 68 };
  var SS = { subdomain: "falcon_subdomain", theme: "falcon_theme", token: "falcon_token" };

  function qs(name) {
    try { return new URLSearchParams(window.location.search).get(name) || ""; }
    catch (e) { return ""; }
  }
  function ssGet(k) { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function ssSet(k, v) { try { if (v) sessionStorage.setItem(k, v); } catch (e) {} }

  var vals = {
    subdomain: ssGet(SS.subdomain) || qs("subdomain"),
    theme: ssGet(SS.theme) || qs("theme"),
    token: ssGet(SS.token) || qs("token")
  };
  ssSet(SS.subdomain, vals.subdomain);
  ssSet(SS.theme, vals.theme);
  ssSet(SS.token, vals.token);

  var wantAuto = qs("auto") === "1";

  if (!vals.subdomain && !vals.theme && !wantAuto) return;

  function hideRow(input) {
    input.style.display = "none";
    if (input.id) {
      var lbl = document.querySelector('label[for="' + input.id + '"]');
      if (lbl) lbl.style.display = "none";
    }
    var prev = input.previousElementSibling;
    if (prev && prev.tagName === "LABEL") prev.style.display = "none";
    var p = input.parentElement;
    for (var i = 0; i < 3 && p; i++) {
      if (p.classList && (p.classList.contains("form-group") || p.classList.contains("form-field"))) {
        p.style.display = "none";
        return;
      }
      p = p.parentElement;
    }
  }

  function fill(optId, value) {
    if (!value) return false;
    var el = document.querySelector('[name="configoptions[' + optId + ']"]');
    if (!el) return false;
    if (el.value !== value || !el.readOnly) {
      el.value = value;
      el.setAttribute("readonly", "readonly");
      el.readOnly = true;
      try { el.dispatchEvent(new Event("change", { bubbles: true })); } catch (e) {}
    }
    hideRow(el);
    return true;
  }

  function findConfigForm() {
    var po = document.querySelector(".package_options");
    if (po) {
      var f = po.closest("form");
      if (f) return f;
    }
    return document.querySelector("form.disable-on-submit");
  }

  function tryAutoSubmit() {
    if (!wantAuto) return;
    var form = findConfigForm();
    if (!form || form.dataset.falconAutoSubmitted) return;
    var subOk = !vals.subdomain || document.querySelector('[name="configoptions[' + OPTS.subdomain + ']"]');
    var themeOk = !vals.theme || document.querySelector('[name="configoptions[' + OPTS.theme + ']"]');
    if (vals.subdomain && subOk) {
      var s = document.querySelector('[name="configoptions[' + OPTS.subdomain + ']"]');
      if (!s || !s.value) return;
    }
    if (vals.theme && themeOk) {
      var t = document.querySelector('[name="configoptions[' + OPTS.theme + ']"]');
      if (!t || !t.value) return;
    }
    form.dataset.falconAutoSubmitted = "1";
    setTimeout(function () { form.submit(); }, 350);
  }

  function apply() {
    var a = fill(OPTS.subdomain, vals.subdomain);
    var b = fill(OPTS.theme, vals.theme);
    if (a || b) tryAutoSubmit();
    return a || b;
  }

  function boot() {
    apply();
    var container = document.querySelector(".package_options") || document.body;
    try {
      var mo = new MutationObserver(function () { apply(); });
      mo.observe(container, { childList: true, subtree: true });
    } catch (e) {}
    var tries = 0;
    var t = setInterval(function () {
      apply();
      if (++tries > 40) clearInterval(t);
    }, 400);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
